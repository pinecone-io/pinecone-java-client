name: Cleanup Test Resources

permissions:
  contents: read

on:
  # Scheduled execution - daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Manual trigger with optional inputs
  workflow_dispatch:
    inputs:
      age_threshold_days:
        description: 'Minimum age in days for resources to be deleted'
        required: false
        default: '1'
        type: number
      dry_run:
        description: 'Preview deletions without executing (dry-run mode)'
        required: false
        default: false
        type: boolean

# Sweeps leftovers that a pull request run's own cleanup job missed. The API does not report creation
# time, so IndexCleanupUtility only deletes indexes and collections whose names carry the integration
# test prefix (run id + creation minute) and are older than the age threshold; runs still in progress
# and any resource not created by the integration tests are left alone. An age threshold of 0 deletes
# every test-prefixed resource, including those of runs in progress.
jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'
      
      - name: Build project
        run: ./gradlew build -x test
      
      - name: Run cleanup utility
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          # Determine parameters based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AGE_THRESHOLD=${{ inputs.age_threshold_days }}
            DRY_RUN=${{ inputs.dry_run }}
          else
            # Scheduled run uses default values
            AGE_THRESHOLD=1
            DRY_RUN=false
          fi
          
          # Build command with arguments
          ARGS="--age-threshold-days $AGE_THRESHOLD"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          
          echo "Running cleanup with: $ARGS"
          
          # Run from the shadow jar alone: the thin jar and build/classes reference
          # unrelocated okhttp3, which only exists relocated inside the shadow jar.
          java -cp build/libs/*-all.jar \
            io.pinecone.helpers.IndexCleanupUtility $ARGS
      
      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Cleanup completed successfully"
          else
            echo "❌ Cleanup failed - check logs for details"
          fi
