name: Pull Request

on: 
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main

# Least-privilege default: build, integration tests, and cleanup only read the repo.
permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Pushes to main and manual dispatches get one group
# per run, so they never cancel each other. A cancelled run still runs its cleanup job, which only
# deletes resources tagged with that run's id.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [8, 11, 16, 17]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Setup gradle.properties
      if: matrix.java == 16 || matrix.java == 17
      run: |
        echo "org.gradle.jvmargs=-Xmx4096m --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED" >> gradle.properties
    
    - name: Execute Gradle build
      run: ./gradlew build compileIntegrationTestJava

    # Same task and JDK as build-and-publish-docs.yml. docs-preview.yml finds this job by its name,
    # "build (ubuntu-latest, 8)", and deploys the docs-html artifact, so renaming either breaks PR
    # previews.
    - name: Build Javadoc
      if: github.event_name == 'pull_request' && matrix.java == 8
      run: ./gradlew generateJavadoc

    # Reviewers can download this when the PR preview deploy fails.
    - name: Upload built HTML
      id: upload-html
      if: github.event_name == 'pull_request' && matrix.java == 8
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: docs-html
        path: docs
        retention-days: 7

    - name: Link built HTML in the job summary
      if: steps.upload-html.outcome == 'success'
      env:
        ARTIFACT_URL: ${{ steps.upload-html.outputs.artifact-url }}
      run: |
        echo "Built Javadoc: [docs-html artifact]($ARTIFACT_URL) (kept 7 days)" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-build-jdk${{ matrix.java }}
        path: |
          build/reports/tests
          build/test-results
        if-no-files-found: ignore
  
  # Decides whether this run can use the live API. Fork PRs and Dependabot runs cannot read Actions
  # secrets, so their live jobs are skipped with a notice and the build job alone gates them. Any
  # other run without a key fails here, so a missing or misnamed secret is not mistaken for a skip.
  live-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
    - name: Check PINECONE_API_KEY is available
      id: check
      run: |
        if [ -n "$PINECONE_API_KEY" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif [ "$IS_FORK_PR" = "true" ] || [ "$GITHUB_ACTOR" = "dependabot[bot]" ]; then
          reason="Live smoke tests skipped: this run cannot read Actions secrets (fork PR or Dependabot). Unit tests in the build job still gate it."
          echo "::notice::$reason"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"
          echo "available=false" >> "$GITHUB_OUTPUT"
        else
          echo "::error::The PINECONE_API_KEY secret is empty or not available to this run."
          exit 1
        fi
      env:
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

  # PRs and pushes to main run only the @Tag("smoke") subset on one JDK. The full live suite runs in
  # full-integration.yml.
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, live-key]
    if: needs.live-key.outputs.available == 'true'
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Setup gradle.properties
      run: |
        echo "org.gradle.jvmargs=-Xmx4096m --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED" >> gradle.properties

    # The build job already ran unit tests and javadoc; this only compiles what smokeTest needs.
    - name: Run smoke tests
      run: ./gradlew smokeTest
      env:
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-smoke-test-jdk17
        path: |
          build/reports/tests
          build/test-results
        if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [live-key, smoke-test]
    if: always() && needs.live-key.outputs.available == 'true'
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build shadow jar
      run: ./gradlew shadowJar

    # Integration tests prefix resource names with GITHUB_RUN_ID, so this only removes what this run
    # created and leaves concurrent runs sharing the Pinecone project alone.
    - name: Cleanup Test Indexes
      continue-on-error: true
      run: |
        echo "Running IndexCleanupUtility to clean up this run's test indexes..."
        java -cp build/libs/*-all.jar io.pinecone.helpers.IndexCleanupUtility --run-id "$GITHUB_RUN_ID"
      env:
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
