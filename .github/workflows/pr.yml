name: Pull Request

on: 
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main

# Least-privilege default: build, integration tests, and cleanup only read the repo.
permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Pushes to main and manual dispatches get one group
# per run, so they never cancel each other. A cancelled run still runs its cleanup job, which only
# deletes resources tagged with that run's id.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [8, 11, 16, 17]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Setup gradle.properties
      if: matrix.java == 16 || matrix.java == 17
      run: |
        echo "org.gradle.jvmargs=-Xmx4096m --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED" >> gradle.properties
    
    - name: Execute Gradle build
      run: ./gradlew build compileIntegrationTestJava

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-build-jdk${{ matrix.java }}
        path: |
          build/reports/tests
          build/test-results
        if-no-files-found: ignore
  
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    # Dependabot-triggered runs cannot read Actions secrets.
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Setup gradle.properties
      if: matrix.java == 16 || matrix.java == 17
      run: |
        echo "org.gradle.jvmargs=-Xmx4096m --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED" >> gradle.properties

    - name: Check PINECONE_API_KEY is set
      run: |
        if [ -z "$PINECONE_API_KEY" ]; then
          echo "::error::The PINECONE_API_KEY secret is empty or not available to this run."
          exit 1
        fi
      env:
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}

    # The build job already ran unit tests and javadoc; this only compiles what integrationTest needs.
    - name: Run integration tests
      run: ./gradlew integrationTest
      env:
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-integration-test-jdk${{ matrix.java }}
        path: |
          build/reports/tests
          build/test-results
        if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, integration-test]
    if: always() && github.actor != 'dependabot[bot]'
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Check PINECONE_API_KEY is set
      run: |
        if [ -z "$PINECONE_API_KEY" ]; then
          echo "::error::The PINECONE_API_KEY secret is empty or not available to this run."
          exit 1
        fi
      env:
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}

    - name: Build shadow jar
      run: ./gradlew shadowJar

    # Integration tests prefix resource names with GITHUB_RUN_ID, so this only removes what this run
    # created and leaves concurrent runs sharing the Pinecone project alone.
    - name: Cleanup Test Indexes
      continue-on-error: true
      run: |
        echo "Running IndexCleanupUtility to clean up this run's test indexes..."
        java -cp build/libs/*-all.jar io.pinecone.helpers.IndexCleanupUtility --run-id "$GITHUB_RUN_ID"
      env:
        PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
